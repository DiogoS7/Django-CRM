{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-brand">
    <span class="app-logo-mark" aria-hidden="true">D</span>
    <span class="app-logo-text">Django CRM</span>
  </div>
  <div class="auth-panel">
    <h1 class="h4 fw-bold mb-4">Create your account</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <button type="submit" class="btn btn-primary w-100 mt-2">Create account</button>
    </form>
  </div>
  <p class="text-center text-secondary mt-3">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
