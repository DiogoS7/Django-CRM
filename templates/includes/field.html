<div class="field{% if wide %} field-wide{% endif %}">
  <label class="form-label" for="{{ field.id_for_label }}">
    {% if field.field.required %}<abbr class="req" title="required">*</abbr>{% endif %}{{ field.label }}
  </label>
  {{ field }}
  {% for error in field.errors %}<div class="field-error">{{ error }}</div>{% endfor %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
</div>
